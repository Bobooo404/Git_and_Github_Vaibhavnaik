<!DOCTYPE html>
<html>
<head>
    <title>To-Do Page</title>
</head>

<body>

    <h1>To-Do Page</h1>

    <p>Fill in the item details and submit the form to store it in MongoDB.</p>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    {% if message %}
        <p style="color: green;">
            {{ message }}
        </p>
    {% endif %}

    <form method="POST" action="/submittodoitem">

        <label>Item ID:</label>
        <br>
        <input type="text" name="itemId" required>
        <br><br>

        <label>Item UUID:</label>
        <br>
        <input type="text" name="itemUuid" required>
        <br><br>

        <label>Item Name:</label>
        <br>
        <input type="text" name="itemName" required>
        <br><br>

        <label>Item Description:</label>
        <br>
        <textarea name="itemDescription" rows="4" required></textarea>
        <br><br>

        <button type="submit">Submit</button>

    </form>

    <br>
    <a href="/">Back to Student Registration Form</a>

</body>
</html>
